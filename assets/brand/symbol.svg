<!--
  schema-lens 서비스 심볼 — 마스터.

  뷰파인더 브래킷 4개 + 정중앙 DB 실린더. 모든 좌표는 정중앙 (50,50)과 아래 값에서 파생된다.
    프레임 7~93 · 브래킷 굵기 12 · 팔 끝 42~58 · 코너 반경 16(중심선)
    DB rx=24.5 ry=9.31 · 윗타원 y=35.56 아랫타원 y=64.44 · 구분선 y=37.583, 53.417

  층 구분선은 흰색을 덧그리지 않고 mask로 뚫는다. 그래야 흰 배경·먹 배경·엷은 회색 앱아이콘
  어디에 얹어도 배경색과 어긋나지 않는다.

  이 파일이 형태의 단일 출처다. 여기 기하를 고치면 아래 둘을 같이 고쳐야 한다.
    - renderer/index.html 의 .applogo — 같은 path 데이터를 인라인으로 복사해 두었다.
      브래킷이 currentColor, 그라디언트가 --sym-db-0/1 토큰을 읽는 것 외에는 동일하다.
    - build/icon.png / icon.icns — 아래 절차로 다시 굽는다.

  ── 앱 아이콘 굽는 법 ────────────────────────────────────────────────────────
  CI는 아이콘을 굽지 않는다. electron-builder 가 저장소에 있는 build/icon.icns 를
  그대로 읽으므로, 심볼을 바꿨으면 아래를 손으로 돌려 결과물을 갱신해야 한다.

    1024x1024 캔버스(바깥은 투명), 그 안에 둥근 사각 824x824 를 #f4f4f5 로 채운다.
      모서리는 border-radius 가 아니라 superellipse |x/a|^n+|y/a|^n=1 (n=5) 이다.
      단순 라운드 사각으로 그리면 macOS 아이콘 사이에서 혼자 튄다.
    이 심볼을 둥근 사각의 72% 크기(593px)로 정중앙에 얹는다.
    2배(2048)로 렌더한 뒤 1024로 줄인다 — 가장자리가 매끈해진다.
    → build/icon.png

    icns 는 아래 열 장이 필요하다(파일명이 곧 규격이다). sips 로 뽑아
    icon.iconset/ 에 넣고 `iconutil -c icns icon.iconset -o build/icon.icns`.
      icon_16x16(16)    icon_16x16@2x(32)    icon_32x32(32)   icon_32x32@2x(64)
      icon_128x128(128) icon_128x128@2x(256) icon_256x256(256)
      icon_256x256@2x(512) icon_512x512(512) icon_512x512@2x(1024)

  이 절차를 그대로 수행하는 스크립트를 scripts/make-icon.js 에 두었다(로컬 전용,
  .gitignore 대상 — check-local.js 와 같은 취급이다).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024"
     role="img" aria-label="schema-lens">
  <defs>
    <linearGradient id="sl-db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63c743"/>
      <stop offset="1" stop-color="#4a9f30"/>
    </linearGradient>
    <mask id="sl-tiers" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <path d="M25.5,37.583 A24.5,9.31 0 0 0 74.5,37.583" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M25.5,53.417 A24.5,9.31 0 0 0 74.5,53.417" fill="none" stroke="#000" stroke-width="2"/>
    </mask>
  </defs>

  <g fill="none" stroke="#18181b" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M42,13 H29 A16,16 0 0 0 13,29 V42"/>
    <path d="M58,13 H71 A16,16 0 0 1 87,29 V42"/>
    <path d="M13,58 V71 A16,16 0 0 0 29,87 H42"/>
    <path d="M87,58 V71 A16,16 0 0 1 71,87 H58"/>
  </g>

  <g mask="url(#sl-tiers)" fill="url(#sl-db)">
    <path d="M25.5,35.56 V64.44 A24.5,9.31 0 0 0 74.5,64.44 V35.56 Z"/>
    <ellipse cx="50" cy="35.56" rx="24.5" ry="9.31"/>
  </g>
</svg>
